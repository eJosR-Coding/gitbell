# Dependency hygiene: RustSec advisories on every lockfile change + weekly.
# Results land as a check run, not as issues (transitive warnings from Tauri
# were flooding the tracker). Known transitive advisories: src-tauri/.cargo/audit.toml
name: audit

on:
  push:
    paths: ["src-tauri/Cargo.lock", "src-tauri/Cargo.toml"]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  cargo-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # The action runs from the repo root, so src-tauri/.cargo/audit.toml is
          # not picked up; keep this list in sync with that file.
          ignore: RUSTSEC-2024-0429,RUSTSEC-2024-0370,RUSTSEC-2025-0075,RUSTSEC-2025-0080,RUSTSEC-2025-0081,RUSTSEC-2025-0098,RUSTSEC-2025-0100,RUSTSEC-2026-0367,RUSTSEC-2026-0368,RUSTSEC-2026-0369,RUSTSEC-2026-0370,RUSTSEC-2026-0371,RUSTSEC-2026-0372
