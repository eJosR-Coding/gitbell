<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitBell</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <section id="onboarding" class="ob" hidden data-step="1" aria-label="GitBell onboarding">
      <div class="ob-top">
        <div class="ob-progress" id="ob-progress" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1">
          <i></i><i></i><i></i>
        </div>
        <span class="ob-step-label" id="ob-step-label"></span>
        <button id="ob-skip" class="ob-skip" type="button" data-i18n="ob.skip"></button>
      </div>

      <!-- step 1: token -->
      <div class="ob-step" data-step="1">
        <div class="ob-mascot">
          <div class="pose" data-pose="wave" aria-hidden="true"></div>
          <p class="ob-say" data-i18n="ob.s1.say"></p>
        </div>
        <div class="ob-body">
          <h2 class="ob-title" data-i18n="ob.s1.title"></h2>
          <div id="ob-s1-form">
            <p class="ob-help" data-i18n-html="ob.s1.help"></p>
            <div class="ob-token">
              <input id="ob-token" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false" />
              <button id="ob-verify" type="button" data-i18n="ob.s1.verify"></button>
            </div>
            <p id="ob-s1-status" class="ob-status" aria-live="polite"></p>
            <div class="ob-create">
              <button id="ob-create-token" type="button" class="ghost" data-i18n="ob.s1.create"></button>
              <span class="ob-create-hint" data-i18n="ob.s1.createHint"></span>
            </div>
          </div>
          <div id="ob-s1-connected" hidden>
            <p class="ob-help" id="ob-s1-already"></p>
            <div class="ob-actions">
              <button id="ob-s1-next" type="button" data-i18n="ob.next"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- step 2: targets -->
      <div class="ob-step" data-step="2" hidden>
        <div class="ob-mascot">
          <div class="pose" data-pose="think" aria-hidden="true"></div>
          <p class="ob-say" data-i18n="ob.s2.say"></p>
        </div>
        <div class="ob-body">
          <h2 class="ob-title" data-i18n="ob.s2.title"></h2>
          <p id="ob-s2-loading" class="ob-help" hidden data-i18n="ob.s2.loading"></p>
          <div class="ob-group">
            <div id="ob-me" class="ob-chips"></div>
          </div>
          <div class="ob-group">
            <h3 data-i18n="ob.s2.repos"></h3>
            <div id="ob-repos" class="ob-chips"></div>
            <p id="ob-s2-none" class="ob-help" hidden data-i18n="ob.s2.none"></p>
          </div>
          <div class="ob-group" id="ob-orgs-block" hidden>
            <h3 data-i18n="ob.s2.orgs"></h3>
            <div id="ob-orgs" class="ob-chips"></div>
          </div>
          <div class="ob-manual">
            <input id="ob-manual" spellcheck="false" data-i18n-placeholder="ob.s2.manual" />
            <button id="ob-manual-add" type="button" class="ghost" data-i18n="targets.add"></button>
          </div>
          <div class="ob-actions">
            <button id="ob-s2-back" type="button" class="ghost" data-i18n="ob.back"></button>
            <button id="ob-s2-next" type="button" data-i18n="ob.next"></button>
          </div>
        </div>
      </div>

      <!-- step 3: first notification -->
      <div class="ob-step" data-step="3" hidden>
        <div class="ob-mascot">
          <div class="pose" data-pose="celebrate" aria-hidden="true"></div>
          <p class="ob-say"></p>
        </div>
        <div class="ob-body">
          <h2 class="ob-title" data-i18n="ob.s3.title"></h2>
          <p id="ob-s3-loading" class="ob-help" data-i18n="ob.s3.loading"></p>
          <div id="ob-latest" class="ob-latest" hidden>
            <span class="notice-dot"></span>
            <div>
              <p class="notice-title" id="ob-latest-title"></p>
              <p class="notice-body" id="ob-latest-body"></p>
              <time id="ob-latest-time"></time>
            </div>
          </div>
          <div class="ob-ring">
            <button id="ob-ring" type="button" data-i18n="ob.s3.ring"></button>
          </div>
          <p class="ob-help ob-tray" data-i18n="ob.s3.tray"></p>
          <label class="toggle">
            <input id="ob-autostart" type="checkbox" checked /> <span data-i18n="ob.s3.autostart"></span>
          </label>
          <div class="ob-actions">
            <button id="ob-s3-back" type="button" class="ghost" data-i18n="ob.back"></button>
            <button id="ob-done" type="button" data-i18n="ob.s3.done"></button>
          </div>
        </div>
      </div>
    </section>

    <header class="topbar">
      <div class="brand">
        <div id="mascot" class="mascot" aria-hidden="true"></div>
        <div>
          <h1>GitBell</h1>
          <p id="status" data-kind="idle" data-i18n="status.idle"></p>
        </div>
      </div>
      <nav class="views" role="tablist" aria-label="Views">
        <button type="button" role="tab" data-view="activity" aria-selected="true" data-i18n="view.activity"></button>
        <button type="button" role="tab" data-view="settings" aria-selected="false" data-i18n="view.settings"></button>
      </nav>
    </header>

    <main>
      <!-- ===== Activity: what happened, who you are ===== -->
      <section class="view" data-view="activity">
        <div id="update-banner" class="update" hidden>
          <div class="pose pose-sm" data-pose="celebrate" aria-hidden="true"></div>
          <div class="update-text">
            <p class="update-title" id="update-title"></p>
            <p class="hint" id="update-notes"></p>
          </div>
          <div class="update-actions">
            <button id="update-later" class="ghost" data-i18n="update.later"></button>
            <button id="update-install" data-i18n="update.install"></button>
          </div>
        </div>
        <div id="identity" class="identity" hidden>
          <img id="id-avatar" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="" width="36" height="36">
          <div class="id-text">
            <p class="id-name" id="id-name"></p>
            <p class="id-login"><span data-i18n="id.connectedAs"></span> <b id="id-login"></b></p>
          </div>
          <button id="poll-now" class="ghost" data-i18n="header.pollNow"></button>
        </div>
        <div id="no-token" class="callout" hidden>
          <div class="pose pose-sm" data-pose="wait" aria-hidden="true"></div>
          <div class="callout-text">
            <p class="callout-title" data-i18n="id.noToken.title"></p>
            <p class="hint" data-i18n="id.noToken.body"></p>
          </div>
          <button id="no-token-cta" data-i18n="id.noToken.cta"></button>
        </div>

        <section class="card">
          <h2 data-i18n="recent.title"></h2>
          <div id="recent-empty" class="empty">
            <div class="pose pose-sm" data-pose="wait" aria-hidden="true"></div>
            <div>
              <p class="empty-title" data-i18n="empty.title"></p>
              <p class="hint" data-i18n="empty.body"></p>
            </div>
          </div>
          <ul id="recent" class="recent"></ul>
        </section>
      </section>

      <!-- ===== Settings ===== -->
      <section class="view" data-view="settings" hidden>
        <section class="card">
          <h2 data-i18n="account.title"></h2>
          <div id="account-connected" class="account" hidden>
            <img id="acc-avatar" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="" width="40" height="40">
            <div class="id-text">
              <p class="id-name" id="acc-name"></p>
              <p class="id-login"><span data-i18n="id.connectedAs"></span> <b id="acc-login"></b></p>
            </div>
            <div class="account-actions">
              <button id="acc-change" class="ghost" data-i18n="account.change"></button>
              <button id="acc-disconnect" class="ghost danger" data-i18n="account.disconnect"></button>
            </div>
          </div>
          <div id="account-form">
            <p class="hint" data-i18n-html="account.hint"></p>
            <div class="row">
              <input id="token" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false" />
              <button id="token-save" data-i18n="account.save"></button>
              <button id="token-cancel" class="ghost" data-i18n="account.cancel" hidden></button>
            </div>
            <p id="token-status" class="hint"></p>
          </div>
        </section>

        <section class="card">
          <h2 data-i18n="targets.title"></h2>
          <h3 class="sub" data-i18n="targets.watching"></h3>
          <p id="targets-none" class="hint" data-i18n="targets.none" hidden></p>
          <ul id="targets" class="chips"></ul>
          <div id="suggestions-block" hidden>
            <h3 class="sub" data-i18n="targets.suggestions"></h3>
            <div id="suggestions" class="ob-chips"></div>
          </div>
          <div class="row manual">
            <input id="target-input" spellcheck="false" data-i18n-placeholder="targets.manual" />
            <button id="target-add" class="ghost" data-i18n="targets.add"></button>
          </div>
        </section>

        <section class="card">
          <h2 data-i18n="notify.title"></h2>
          <div class="options">
            <label class="toggle">
              <input id="sounds-enabled" type="checkbox" /> <span data-i18n="sounds.enabled"></span>
            </label>
            <label>
              <span data-i18n="sounds.volume"></span>
              <input id="volume" type="range" min="0" max="100" step="5" />
            </label>
          </div>
          <div class="notify-head">
            <span></span><span data-i18n="notify.col.on"></span><span data-i18n="notify.col.sound"></span><span></span>
          </div>
          <div id="notify-rows" class="notify-rows"></div>
        </section>

        <section class="card">
          <h2 data-i18n="options.title"></h2>
          <div class="options">
            <label>
              <span data-i18n="options.interval"></span>
              <input id="interval" type="number" min="60" step="30" /> <span data-i18n="options.seconds"></span>
            </label>
            <label class="toggle">
              <input id="ignore-own" type="checkbox" /> <span data-i18n="options.ignoreOwn"></span>
            </label>
            <label class="toggle">
              <input id="agents-own" type="checkbox" /> <span data-i18n="options.agentsOwn"></span>
            </label>
            <label class="toggle">
              <input id="autostart" type="checkbox" /> <span data-i18n="options.autostart"></span>
            </label>
            <label>
              <span data-i18n="options.language"></span>
              <select id="language">
                <option value="auto" data-i18n="lang.auto"></option>
                <option value="es" data-i18n="lang.es"></option>
                <option value="en" data-i18n="lang.en"></option>
              </select>
            </label>
          </div>
          <div class="glass-row">
            <label for="glass"><span data-i18n="options.glass"></span></label>
            <input id="glass" type="range" min="30" max="100" step="5" />
            <output id="glass-value" for="glass"></output>
            <p class="hint" data-i18n="options.glassHint"></p>
          </div>
          <div class="options actions">
            <button id="test-toast" class="ghost" data-i18n="options.test"></button>
            <button id="replay-onboarding" class="ghost" data-i18n="ob.replay"></button>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
