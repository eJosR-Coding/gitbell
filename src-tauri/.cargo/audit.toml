# cargo-audit config. Everything ignored here is a transitive dependency of
# Tauri / gtk-rs that we cannot upgrade from this crate. Revisit when Tauri
# bumps gtk-rs to 0.20+ (glib fix) and drops proc-macro-error / unic-*.
[advisories]
ignore = [
  "RUSTSEC-2024-0429", # glib 0.18 VariantStrIter unsoundness, fixed in 0.20 (pinned by tao/gtk)
  "RUSTSEC-2024-0370", # proc-macro-error unmaintained (via tauri build deps)
  "RUSTSEC-2025-0075", # unic-char-range unmaintained (via tauri-utils)
  "RUSTSEC-2025-0080", # unic-common
  "RUSTSEC-2025-0081", # unic-char-property
  "RUSTSEC-2025-0098", # unic-ucd-version
  "RUSTSEC-2025-0100", # unic-ucd-ident
  "RUSTSEC-2026-0367", # zip 4.6 SUID/SGID on extract (via tauri-plugin-updater; even 2.14 pins zip 4)
  "RUSTSEC-2026-0368", # zip 4.6 symlink targets on extract (same); the updater only extracts
  "RUSTSEC-2026-0369", # zip 4.6 unix permissions on extract (same); payloads whose minisign signature verified
  "RUSTSEC-2026-0370", # zvariant unmaintained (via zbus / notify-rust)
  "RUSTSEC-2026-0371", # zbus_names unmaintained
  "RUSTSEC-2026-0372", # zvariant_derive unmaintained
]
